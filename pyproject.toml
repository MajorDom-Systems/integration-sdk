[project]
name = "majordom-transports"
version = "0.1.0"
description = "Radios, firmware and the services between them and MajorDom integrations."
authors = [{ name = "Mark Parker", email = "mark@parker-programs.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["majordom", "smart-home", "home-automation", "iot", "radio", "zigbee", "thread", "matter", "z-wave", "bluetooth", "firmware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.12"
dependencies = [
    "majordom-integration-sdk (>=0.2.0,<0.3.0)",
    "pydantic (>=2.13.5,<3.0)",
    "pyserial (>=3.5)",
]

[project.urls]
Homepage = "https://majordom.io"
Documentation = "https://docs.majordom.io/hub/radios/"
Repository = "https://github.com/MajorDom-Systems/majordom-transports"
Issues = "https://github.com/MajorDom-Systems/majordom-transports/issues"

[dependency-groups]
dev = ["poethepoet (>=0.36.0,<1.0.0)", "ty", "ruff", "pip-audit", "pytest", "pytest-asyncio", "pytest-cov"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "majordom_transports" }]
include = [{ path = "majordom_transports/images", format = ["sdist", "wheel"] }]

# The tests' consumers are bare classes standing in for integration controllers, and their drivers subclass the
# registered driver's runtime class: ty can't match the former to the Consumer protocol nor follow the latter
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unsupported-base = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.poe.tasks.install]
shell = """
poetry install
echo '#!/bin/sh\npoetry run poe check' > .git/hooks/pre-commit
chmod +x .git/hooks/pre-commit
echo "Pre-commit hook installed."
"""

[tool.poe.tasks.check]
shell = """
code=0

echo "\nRunning ruff lint:"
poetry run ruff check --fix || code=1

echo "\nRunning ruff format:"
poetry run ruff format || code=1

echo "\nRunning ty:"
poetry run ty check || code=1

echo "\nRunning pytest:"
poetry run pytest --cov=majordom_transports --cov-report=xml || code=1

echo "\nRunning poetry build:"
poetry build || code=1

echo "\nRunning poetry check:"
poetry check || code=1

${ci:+git diff --exit-code} || code=1

exit $code
"""
args = [{ name = "ci", type = "boolean" }]
