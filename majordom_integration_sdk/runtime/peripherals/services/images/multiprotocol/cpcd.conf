# cpcd configuration for the MajorDom multiprotocol harness.
# Mounted into the container at the image's expected path (/usr/local/etc/cpcd.conf); the entrypoint
# replaces the baud and flow control with the RCP firmware's (RADIO_BAUD, RADIO_FLOW_CONTROL).
instance_name: cpcd_0
bus_type: UART
uart_device_file: /dev/ttyRCP
uart_device_baud: 460800
uart_hardflow: true
bootloader_recovery_pins_enabled: false
# Dev: the NabuCasa multi-PAN RCP is built without CPC security, so disable encryption to
# skip the binding-key dance. For a hardened production image, build/flash an RCP WITH CPC
# security enabled and set this to false + provision /root/.cpcd/binding.key instead.
disable_encryption: true
stdout_trace: false
rlimit_nofile: 2000
