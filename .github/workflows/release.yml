name: Release

# Trigger manually from the develop branch (Actions → Release → Run workflow).
on:
  workflow_dispatch:

# The reusable release workflow needs write (bump/merge/tag/release) + OIDC, and can't exceed the caller's grant.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: ParkerIndustries/workflows/.github/workflows/release.yml@v1
    with:
      pypi-package-name: majordom-transports
      python-version: "3.12"
      stable-branch: master

  # PyPI publish runs HERE, in the caller — Trusted Publishing can't match a reusable workflow.
  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/majordom-transports
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
